<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
    <linearGradient id="psiblade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <!-- Silhouette Initié -->
  <path d="M200 80 L225 140 L215 170 L235 220 L220 280 L200 320 L180 280 L165 220 L185 170 L175 140 Z" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
  <!-- Casque & Visage Psionique -->
  <polygon points="200,85 218,125 200,140 182,125" fill="#312e81" stroke="#c084fc" stroke-width="2"/>
  <polygon points="190,115 210,115 205,120 195,120" fill="#38bdf8" filter="url(#glow)"/>
  <!-- Épaulettes & Armure Cristalline -->
  <path d="M165 145 L135 175 L170 185 L180 160 Z" fill="#3730a3" stroke="#818cf8" stroke-width="1.5"/>
  <path d="M235 145 L265 175 L230 185 L220 160 Z" fill="#3730a3" stroke="#818cf8" stroke-width="1.5"/>
  <!-- Lames Plasmiques Psioniques Jumelles -->
  <path d="M130 180 L80 100 L120 170 Z" fill="url(#psiblade)" filter="url(#glow)"/>
  <path d="M270 180 L320 100 L280 170 Z" fill="url(#psiblade)" filter="url(#glow)"/>
  <line x1="80" y1="100" x2="135" y2="185" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <line x1="320" y1="100" x2="265" y2="185" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <!-- Pectoral Psionique -->
  <circle cx="200" cy="190" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <!-- Aura d'énergie -->
  <ellipse cx="200" cy="350" rx="80" ry="14" fill="#6366f1" opacity="0.3" filter="url(#glow)"/>
  <text x="200" y="380" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle" letter-spacing="3">INITIÉ ÉTHÉRÉ</text>
</svg>

