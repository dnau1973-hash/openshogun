<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="60%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>
    <linearGradient id="goldbeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="titanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <!-- Anneau d'antigravité inférieur -->
  <ellipse cx="200" cy="300" rx="90" ry="24" fill="none" stroke="#a855f7" stroke-width="4" filter="url(#titanGlow)"/>
  <ellipse cx="200" cy="300" rx="70" ry="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <ellipse cx="200" cy="300" rx="40" ry="10" fill="#38bdf8" opacity="0.6" filter="url(#titanGlow)"/>
  <!-- Piliers & Structure Colosse en Lévitation -->
  <polygon points="170,140 230,140 250,220 235,290 165,290 150,220" fill="#1e1b4b" stroke="#e0e7ff" stroke-width="2"/>
  <polygon points="180,70 220,70 240,140 160,140" fill="#312e81" stroke="#a855f7" stroke-width="2"/>
  <!-- Cœur Psionique Central -->
  <circle cx="200" cy="180" r="22" fill="#38bdf8" filter="url(#titanGlow)"/>
  <circle cx="200" cy="180" r="12" fill="#ffffff"/>
  <!-- Doubles Canons à Lances Thermiques Jumelles -->
  <rect x="110" y="120" width="14" height="150" rx="4" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="276" y="120" width="14" height="150" rx="4" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
  <!-- Rayons Thermiques Descendants -->
  <line x1="117" y1="270" x2="117" y2="350" stroke="url(#goldbeam)" stroke-width="5" filter="url(#titanGlow)"/>
  <line x1="283" y1="270" x2="283" y2="350" stroke="url(#goldbeam)" stroke-width="5" filter="url(#titanGlow)"/>
  <text x="200" y="380" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="3">COLOSSE LÉVITATION</text>
</svg>

