<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="shieldgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)"/>
  <!-- Grand Bouclier Télékinétique Déviateur Hexagonal -->
  <polygon points="200,50 310,110 310,250 200,320 90,250 90,110" fill="url(#shieldgrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow2)"/>
  <polygon points="200,75 285,125 285,235 200,295 115,235 115,125" fill="none" stroke="#e0e7ff" stroke-width="1.5" opacity="0.6"/>
  <!-- Tracé Hexagonal Énergétique -->
  <line x1="200" y1="75" x2="200" y2="295" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
  <line x1="115" y1="125" x2="285" y2="235" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
  <line x1="115" y1="235" x2="285" y2="125" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
  <!-- Silhouette Gardien derrière le bouclier -->
  <circle cx="200" cy="145" r="28" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <polygon points="190,140 210,140 205,145 195,145" fill="#38bdf8" filter="url(#glow2)"/>
  <circle cx="200" cy="200" r="14" fill="#38bdf8" filter="url(#glow2)"/>
  <text x="200" y="375" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="3">BASTION PSIONIQUE</text>
</svg>

